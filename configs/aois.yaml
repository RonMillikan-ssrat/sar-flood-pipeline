# Areas of interest for the domain-shift experiment.
#
# role:
#   train   - source domain: open floodplains, plentiful Copernicus EMS labels
#   holdout - target domain: never seen in training; used to measure shift
#
# bbox is [min_lon, min_lat, max_lon, max_lat] in EPSG:4326.
# These boxes are APPROXIMATE starting points. Check and adjust them in
# Copernicus Browser before relying on them.
#
# events: date windows used for backfills.
#   reference: dry-period window searched for same-track reference passes
#   (must end by the event start).
# Dates marked "verify" have not been checked against an EMS activation,
# gauge record, or seasonal water extent yet.

aois:
  sindh:
    role: train
    description: Lower Indus floodplain near Dadu / Lake Manchar, Pakistan
    bbox: [67.5, 26.0, 68.5, 27.5]
    events:
      - name: pakistan-2022
        start: "2022-08-15"
        end: "2022-09-30"
        notes: "Copernicus EMS activations EMSR629 / EMSR631"
        reference: {start: "2022-03-01", end: "2022-06-01"}  # pre-monsoon; verify

  jamuna:
    role: train
    description: Jamuna (Brahmaputra) floodplain near Sirajganj, Bangladesh
    bbox: [89.4, 24.0, 90.0, 25.3]
    events:
      - name: monsoon-2024
        start: "2024-07-01"
        end: "2024-09-30"
        notes: "verify - generic monsoon window, not a specific event"
        reference: {start: "2024-01-15", end: "2024-04-15"}  # dry season; verify

  sylhet:
    role: train
    description: Sylhet haor basin, northeastern Bangladesh
    bbox: [91.4, 24.6, 92.2, 25.2]
    events:
      - name: sylhet-2022
        start: "2022-06-10"
        end: "2022-07-10"
        notes: "verify"
        reference: {start: "2022-01-15", end: "2022-04-01"}  # haors dry; verify
      - name: sylhet-2025
        start: "2025-05-25"
        end: "2025-06-20"
        notes: "Extreme rainfall late May / early June 2025"
        reference: {start: "2025-01-15", end: "2025-04-01"}  # haors dry; verify

  houston:
    role: holdout
    description: Houston metro and Addicks/Barker reservoirs (urban, hard case for SAR)
    bbox: [-95.8, 29.5, -95.0, 30.1]
    events:
      - name: harvey-2017
        start: "2017-08-24"
        end: "2017-09-10"
        notes: "Hurricane Harvey"
        reference: {start: "2017-06-15", end: "2017-08-20"}  # pre-storm; verify

  red-river:
    role: holdout
    description: Red River of the North, Fargo to Grand Forks (rural, USGS-gauged)
    bbox: [-97.1, 46.7, -96.6, 48.0]
    events: []  # TODO: pick a spring flood year from the USGS gauge record

  larkana:
    role: train
    description: EMSR629 AOI01 Larkana (labels = EMS delineation from SPOT-6/7, 2022-08-30 05:44 UTC)
    bbox: [68.05, 27.44, 68.46, 27.72]
    events:
      - name: pakistan-2022
        start: "2022-08-15"
        end: "2022-09-30"
        notes: "EMSR629 AOI01 DEL v2; SPOT-6/7 30 Aug 2022 05:44 UTC, 4 h after S1A track 78D"
        reference: {start: "2022-03-01", end: "2022-06-01"}  # pre-monsoon; verify

  shikarpur:
    role: train
    description: EMSR629 AOI02 Shikarpur (labels = EMS DEL from SPOT-6-7 30/08/2022 T05:45:30Z)
    bbox: [68.47, 27.74, 68.86, 28.01]
    events:
      - name: pakistan-2022
        start: "2022-08-15"
        end: "2022-09-30"
        notes: "EMSR629_AOI02_DEL_PRODUCT_r1_RTP01_v1_vector.zip"
        reference: {start: "2022-03-01", end: "2022-06-01"}  # copied from larkana; verify

  jacobabad:
    role: train
    description: EMSR629 AOI03 Jacobabad (labels = EMS DEL from SPOT-6-7 30/08/2022 T05:44:37Z)
    bbox: [68.22, 28.09, 68.62, 28.36]
    events:
      - name: pakistan-2022
        start: "2022-08-15"
        end: "2022-09-30"
        notes: "EMSR629_AOI03_DEL_PRODUCT_r1_RTP01_v1_vector.zip"
        reference: {start: "2022-03-01", end: "2022-06-01"}  # copied from larkana; verify
