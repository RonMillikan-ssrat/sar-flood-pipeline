[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sarflood"
version = "0.1.0"
description = "Sentinel-1 SAR flood mapping with domain-shift monitoring (Airflow, MLflow, GCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "numpy>=1.26",
    "rasterio>=1.4",
    "matplotlib>=3.8",
    "pyshp>=2.3",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
unet = ["torch>=2.2"]
tracking = ["mlflow>=3.0"]   # install the CUDA build that matches your GPU/driver
databricks = [
    "databricks-sdk>=0.171.0",
]
# Airflow is installed separately with its constraints file; see README.

[project.scripts]
sarflood = "sarflood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
