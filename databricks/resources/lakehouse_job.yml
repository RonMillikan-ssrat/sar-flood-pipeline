# Phase 1: bronze -> silver -> gold -> train/register/gate/holdout, as one job.
# No compute block: on Free Edition, jobs run on serverless. Each notebook %pip-installs
# the sarflood wheel from the Volume (scripts/upload_to_volume.py --wheel ...).
#
#   databricks bundle deploy && databricks bundle run sarflood_lakehouse
resources:
  jobs:
    sarflood_lakehouse:
      name: sarflood-lakehouse
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              write_method: parquet
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../notebooks/03_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              train_aois: ${var.train_aois}
        - task_key: train
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ../notebooks/04_train.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              train_aois: ${var.train_aois}
              holdout_aois: ${var.holdout_aois}
              method: hgb_bal
              min_delta: "0.0"
